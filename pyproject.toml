[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ultrasonic-signal-lab"
version = "0.1.0"
description = "Offline pulse-echo signal analysis with explicit synthetic evaluation."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [{name = "Syed Abdul Muqeeth"}]
dependencies = ["numpy>=2,<3", "scipy>=1.16,<1.19", "matplotlib>=3.10,<3.12"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.9,<1", "build>=1.2,<2"]

[project.scripts]
ultrasonic-lab = "ultrasonic_lab.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]

[tool.coverage.run]
source = ["ultrasonic_lab"]
